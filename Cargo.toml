[package]
name = "xmip-core-transport-webdav"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-webdav"
description = "WebDAV transport: a collection over HTTP — PROPFIND lists, GET and DELETE take, PUT delivers, and LOCK is the native claim, so two nodes never take one file twice. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The http technology is a sibling, used for what it
# already is: HTTP's requests and answers on the wire, the endpoint and the
# target. Standard library otherwise: WebDAV is HTTP methods and a little XML.
# Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { workspace = true, optional = true }
http = { workspace = true, optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:codec", "dep:http", "dep:net"]
# The declaration alone, with the lock's default hold.
declaration = []
# HTTPS, through http's: `webdavs://` and `https://` need it; the
# technology's code, so the default with it.
tls = ["default", "http/tls"]

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The timing program's figure, the fastest of five over its rounds beside a
# plain wake, read once for the estate (`xcore::latency`); for the tests
# only.
xcore = { workspace = true, features = ["test-support"] }
