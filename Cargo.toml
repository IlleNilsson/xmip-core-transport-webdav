# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-webdav"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-webdav"
description = "WebDAV transport: a collection over HTTP — PROPFIND lists, GET and DELETE take, PUT delivers, and LOCK is the native claim, so two nodes never take one file twice. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The http technology is a sibling, used for what it
# already is: HTTP's requests and answers on the wire, the endpoint and the
# target. Standard library otherwise: WebDAV is HTTP methods and a little XML.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[features]
# HTTPS, through http's: `webdavs://` and `https://` need it.
tls = ["http/tls"]
